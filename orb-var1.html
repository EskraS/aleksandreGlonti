<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Orb</title>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
          }
        }
    </script>

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <script type="module">
        import * as THREE from "three";
        import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
        import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
        import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
        import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

        const TWO_PI = Math.PI * 2;

        /* ---------- pinned look ---------- */
        const look = {
            radius: 1.0,
            height: 1.9,
            bulge: 0.06,
            lobeStrength: 0.13,
            lobeCount: 3,        // must stay an integer so each ring closes seamlessly
            pullStrength: 0.09,
            pullSpread: 0.18,
            twist: 0.3,
            wobble: 0.2,
            density: 0.4,
            rim: 0.6,
            opacity: 0.5,
            flow: 1.5,
            glow: 0.2,
            spin: 0.06,
        };

        /* ---------- boot: grow plain rings → hold → distort ---------- */
        const boot = {
            delay: 0.12 / 1.8,
            growDuration: 0.9 / 1.8,
            hold: 0.15,
            distortDuration: 0.45,
            volume: 0.8,
            soundLead: 0.2, // seconds before distortion starts. bigger = earlier
        };

        function easeOutCubic(p) {
            return 1 - Math.pow(1 - p, 3);
        }

        function bootCurves(elapsed) {
            const t = elapsed - boot.delay;
            if (t <= 0) return { size: 0, shape: 0, fade: 0 };

            const growP = Math.min(t / boot.growDuration, 1);
            const size = easeOutCubic(Math.pow(growP, 1.7));

            const distortT = t - boot.growDuration - boot.hold;
            const distortP = distortT <= 0 ? 0 : Math.min(distortT / boot.distortDuration, 1);
            const shape = easeOutCubic(distortP);

            const fade = Math.min(1, size * 4.0);
            return { size, shape, fade };
        }

        /* ---------- geometry: stacked rings, shared vertices ---------- */
        const ringCount = 200;
        const segmentsPerRing = 360;
        const vertexCount = ringCount * segmentsPerRing;

        const ringCoords = new Float32Array(vertexCount * 2);   // x: height 0..1, y: angle
        const lineIndices = new Uint32Array(vertexCount * 2);   // two vertex indices per segment

        for (let ring = 0; ring < ringCount; ring++) {
            const t = ring / (ringCount - 1);
            const ringStart = ring * segmentsPerRing;

            for (let seg = 0; seg < segmentsPerRing; seg++) {
                const vertex = ringStart + seg;
                ringCoords[vertex * 2] = t;
                ringCoords[vertex * 2 + 1] = (seg / segmentsPerRing) * TWO_PI;

                lineIndices[vertex * 2] = vertex;
                lineIndices[vertex * 2 + 1] = ringStart + (seg + 1) % segmentsPerRing;
            }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("ringCoord", new THREE.BufferAttribute(ringCoords, 2));
        geometry.setIndex(new THREE.BufferAttribute(lineIndices, 1));
        geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 2.0);

        /* ---------- animated actors ---------- */
        // home height, travel range, height width, angular offset, signed strength, travel speed, start offset
        const swells = [
            { home: 0.18, travel: 0.20, width: 0.135, offset: 0.0, strength: 1.30, speed: 0.21, start: 0.0 },
            { home: 0.48, travel: 0.24, width: 0.11, offset: 2.1, strength: 0.95, speed: 0.16, start: 1.7 },
            { home: 0.80, travel: 0.18, width: 0.145, offset: 4.2, strength: 1.15, speed: 0.26, start: 3.9 },
        ];
        const dents = [
            { home: 0.30, travel: 0.22, width: 0.12, offset: 1.2, strength: -1.10, speed: 0.13, start: 0.8 },
            { home: 0.62, travel: 0.25, width: 0.11, offset: 3.4, strength: -0.90, speed: 0.19, start: 2.6 },
            { home: 0.88, travel: 0.20, width: 0.145, offset: 5.0, strength: -1.25, speed: 0.24, start: 4.8 },
        ];
        // start angle, home height, signed strength (+ swells out, - presses in), angular tightness, angular drift speed
        const pulls = [
            { angle: 2.4, home: 0.35, strength: 0.90, tightness: 7.0, drift: 0.26 },
            { angle: 5.3, home: 0.62, strength: -0.75, tightness: 8.0, drift: -0.19 },
            { angle: 0.8, home: 0.80, strength: 0.60, tightness: 5.0, drift: 0.34 },
            { angle: 1.6, home: 0.45, strength: -1.40, tightness: 11.0, drift: -0.31 },
            { angle: 4.1, home: 0.70, strength: -1.20, tightness: 13.0, drift: 0.22 },
        ];

        const phases = { swell: 0.7, baseline: 2.1, ripple: 4.4, dent: 5.1 };

        const toPocket = (p) => new THREE.Vector4(p.home, p.width, p.offset, p.strength);
        const toPull = (p) => new THREE.Vector4(p.angle, p.home, p.strength, p.tightness);

        const uniforms = {
            uRadius: { value: look.radius },
            uHeight: { value: look.height },
            uBulge: { value: look.bulge },
            uLobeStrength: { value: look.lobeStrength },
            uPullStrength: { value: look.pullStrength },
            uPullSpread: { value: look.pullSpread },
            uTwist: { value: look.twist },
            uWobble: { value: look.wobble },
            uLobes: {
                value: new THREE.Vector4(
                    look.lobeCount,
                    Math.max(2, look.lobeCount - 1),
                    look.lobeCount * 2 + 3,
                    look.lobeCount * 5 + 2,
                ),
            },
            uSwellPhase: { value: phases.swell },
            uBaselinePhase: { value: phases.baseline },
            uRipplePhase: { value: phases.ripple },
            uSwells: { value: swells.map(toPocket) },
            uDents: { value: dents.map(toPocket) },
            uPulls: { value: pulls.map(toPull) },
            uRingStep: { value: 1 / (ringCount - 1) },
            uGapReference: { value: look.height / (ringCount - 1) },
            uDensity: { value: look.density },
            uRim: { value: look.rim },
            uOpacity: { value: look.opacity },
            uGradientDirection: { value: new THREE.Vector2(0.82, 0.57).normalize() },
            uBootSize: { value: 0 },
            uBootShape: { value: 0 },
            uBootFade: { value: 0 },
        };

        /* ---------- shaders ---------- */
        const vertexShader = /* glsl */`
            attribute vec2 ringCoord;

            uniform float uRadius, uHeight;
            uniform float uBulge, uLobeStrength, uPullStrength, uPullSpread, uTwist, uWobble;
            uniform vec4 uLobes;          // swell lobes, dent lobes, baseline harmonic, ripple harmonic
            uniform float uSwellPhase, uBaselinePhase, uRipplePhase;
            uniform vec4 uSwells[${swells.length}];   // height center, height width, full phase, signed strength
            uniform vec4 uDents[${dents.length}];
            uniform vec4 uPulls[${pulls.length}];     // angle, height center, signed strength, angular tightness
            uniform float uRingStep, uGapReference;
            uniform float uDensity, uRim, uOpacity;
            uniform vec2 uGradientDirection;
            uniform float uBootSize, uBootShape, uBootFade;

            varying vec3 vColor;
            varying float vIntensity;
            varying float vAlpha;

            const float PI = 3.141592653589793;

            float bump(float x) {
                return pow(0.5 + 0.5 * cos(x), 1.25);
            }

            float pocket(vec4 p, float lobes, float ang, float t) {
                float d = (t - p.x) / p.y;
                return p.w * exp(-d * d) * bump(lobes * ang + p.z);
            }

            float field(float ang, float t) {
                float w = 0.18 * sin(uLobes.z * ang + uBaselinePhase);
                for (int i = 0; i < ${swells.length}; i++) {
                    w += pocket(uSwells[i], uLobes.x, ang, t);
                }
                for (int i = 0; i < ${dents.length}; i++) {
                    w += pocket(uDents[i], uLobes.y, ang, t);
                }
                return w / (1.0 + 0.18 * w * w);
            }

            vec3 displace(float t, float theta, out float w) {
                float ang = theta + uTwist * (t - 0.5);
                float heightSin = max(sin(PI * t), 0.0);
                float envelope = 0.35 + 0.65 * heightSin * heightSin;

                w = field(ang, t);

                float radius = uRadius * (1.0 + uBulge * (pow(heightSin, 1.5) - 0.30));
                radius += uRadius * uLobeStrength * envelope
                        * (2.3 * w + 0.07 * sin(uLobes.w * ang + uRipplePhase));

                float y = (t - 0.5) * uHeight;
                for (int i = 0; i < ${pulls.length}; i++) {
                    vec4 p = uPulls[i];
                    float dh = t - p.y;
                    float g = uRadius * uPullStrength * p.z
                            * exp(p.w * (cos(ang - p.x) - 1.0) - dh * dh / (uPullSpread * uPullSpread));
                    radius += g;
                    y -= 1.4 * dh * g;  
                }

                radius = max(radius, 0.05);
                y += uRadius * uWobble * 0.18 * sin(uLobes.x * ang + uSwellPhase + 2.3) * envelope;

                vec3 deformed = vec3(radius * cos(theta), y, radius * sin(theta));
                vec3 plain = vec3(uRadius * cos(theta), (t - 0.5) * uHeight, uRadius * sin(theta));
                return mix(plain, deformed, uBootShape);
            }

            void main() {
                float t = ringCoord.x;
                float theta = ringCoord.y;

                float w, nextW;
                vec3 displaced = displace(t, theta, w);
                vec3 nextRing = displace(t + uRingStep, theta, nextW);

                // shading from the unscaled shape so density/rim/depth stay consistent while growing
                vec4 view = modelViewMatrix * vec4(displaced, 1.0);
                vec4 nextView = modelViewMatrix * vec4(nextRing, 1.0);

                // uniform scale from center — plain rings grow, then shape blooms in
                gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced * uBootSize, 1.0);

                float gap = length(nextView.xy - view.xy) * (3.5 / max(-view.z, 0.8));
                float density = clamp(uGapReference / max(gap, 1e-5), 0.0, 2.0) * 0.5;

                vec2 screenDir = length(view.xy) > 0.03 ? normalize(view.xy) : vec2(0.0, 1.0);
                float gradient = 0.5 - 0.5 * clamp(dot(screenDir, uGradientDirection) * 1.65, -1.0, 1.0);


                vec3 color1 = vec3(0.000, 0.208, 0.239); // #00353D
                vec3 color2 = vec3(0.067, 0.478, 0.541); // #117A8A
                vec3 color3 = vec3(0.478, 0.792, 1.000); // #7ACAFF
                
                if (gradient < 0.73) {
                    vColor = mix(color1, color2, gradient / 0.73);  
                } else {
                    vColor = mix(color2, color3, (gradient - 0.73) / 0.27);
                }

                float rim = smoothstep(0.55, 1.0, abs(t - 0.5) * 2.0);
                float depth = clamp((-view.z - 3.6) / 2.6, 0.0, 1.0);

                vIntensity = (1.0 + uDensity * 2.2 * density * density)
                           * (1.0 + uRim * 1.2 * rim)
                           * (1.0 + 0.22 * w * uBootShape)
                           * mix(1.06, 0.50, depth);

                float ang = theta + uTwist * (t - 0.5);
                float sheen = 0.86 + 0.14 * sin(ang * 2.0 + uSwellPhase * 1.7 + t * 5.0);
                vAlpha = uOpacity * mix(0.35, 1.0, density) * sheen * uBootFade;
            }
        `;

        const fragmentShader = /* glsl */`
            varying vec3 vColor;
            varying float vIntensity;
            varying float vAlpha;

            void main() {
                gl_FragColor = vec4(vColor * vIntensity, vAlpha);
            }
        `;

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader,




            
            fragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: false,
        });

        const tubeLines = new THREE.LineSegments(geometry, material);

        /* ---------- renderer, locked top-down camera, bloom ---------- */
        // render above screen resolution: hairline rings and a tighter bloom
        const superSample = 2;
        const maxPixelRatio = 3;

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.add(tubeLines);

        const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(0, 5, 0);
        camera.up.set(0, 0, -1);
        camera.lookAt(0, 0, 0);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), look.glow, 0.75, 0.0));
        composer.addPass(new OutputPass());

        function resize() {
            const pixelRatio = Math.min(devicePixelRatio * superSample, maxPixelRatio);

            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();

            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(innerWidth, innerHeight);
            composer.setPixelRatio(pixelRatio);
            composer.setSize(innerWidth, innerHeight);
        }

        resize();

        // voice reaction
        // write here

        let analyser = null;
        let freqData = null;

        async function getMicrophone(){

            let audioRec = await navigator.mediaDevices.getUserMedia({audio: true});

            const audioContext = new AudioContext();
            await audioContext.resume();
            console.log("audio state:", audioContext.state);
            let source = audioContext.createMediaStreamSource(audioRec);
            analyser = audioContext.createAnalyser();

            analyser.fftSize =1024;
            analyser.smoothingTimeConstant = 0.7;
            freqData = new Uint8Array(analyser.frequencyBinCount)




            source.connect(analyser)

        }

        const voice = { low: 0, mid: 0, high: 0};

        function bandLevel(loHz, hiHz){
            const hzPerBin = analyser.context.sampleRate / analyser.fftSize;

            const a = Math.floor(loHz / hzPerBin);
            const b = Math.ceil(hiHz / hzPerBin);

            let sum = 0;

            for (let i = a; i < b; i++){
                sum += freqData[i];
            }

            return sum = (sum / ((b-a) * 255))

        }

        function follow(current, target, dt) {
            const speed = target > current ?  18 : 4
            return current + (target - current) * (1 - Math.exp(-dt * speed));
        }


        /* ---------- animation ---------- */
        function travel(actors, targets, groupPhase, time) {
            actors.forEach((p, i) => {
                targets[i].x = p.home + p.travel * Math.sin(time * p.speed * look.flow + p.start);
                targets[i].z = groupPhase + p.offset;
            });
        }

        const clock = new THREE.Clock();
        let bootStart = 0;

        const loadSound = new Audio("sounds/loadMain.mp3");
        loadSound.volume = boot.volume;
        let loadSoundPlayed = false;

        function playLoadSound() {
            loadSound.currentTime = 0;
            loadSound.play().catch(() => { });
        }

        window.bootOrb = () => {
            bootStart = clock.elapsedTime;
            loadSoundPlayed = false;
            loadSound.pause();
            loadSound.currentTime = 0;
            uniforms.uBootSize.value = 0;
            uniforms.uBootShape.value = 0;
            uniforms.uBootFade.value = 0;
        };

        renderer.setAnimationLoop(() => {
            

            
            const dt = Math.min(clock.getDelta(), 0.05);

            if(analyser) {
                analyser.getByteFrequencyData(freqData)

                voice.low = follow(voice.low, bandLevel(80, 300), dt);
                voice.mid = follow(voice.mid, bandLevel(300, 1500), dt);
                voice.high = follow(voice.high, bandLevel(1500, 5000), dt);

                console.log(voice.low.toFixed(2), voice.mid.toFixed(2), voice.high.toFixed(2));
            }

            
            const time = clock.elapsedTime;
            const flowStep = dt * look.flow;
            const bootElapsed = time - bootStart;

            const curves = bootCurves(bootElapsed);
            uniforms.uBootSize.value = curves.size;
            uniforms.uBootShape.value = curves.shape;
            uniforms.uBootFade.value = curves.fade;

            // distortion begins at growDuration + hold; soundLead pulls playback earlier
            const sinceDelay = bootElapsed - boot.delay;
            const soundAt = boot.growDuration + boot.hold - boot.soundLead;
            if (!loadSoundPlayed && sinceDelay >= soundAt) {
                loadSoundPlayed = true;
                playLoadSound();
            }

            tubeLines.rotation.y += dt * look.spin;

            phases.swell += flowStep * 0.50;
            phases.baseline -= flowStep * 0.85;
            phases.ripple += flowStep * 1.40;
            phases.dent -= flowStep * 0.33;

            uniforms.uSwellPhase.value = phases.swell;
            uniforms.uBaselinePhase.value = phases.baseline;
            uniforms.uRipplePhase.value = phases.ripple;

            travel(swells, uniforms.uSwells.value, phases.swell, time);
            travel(dents, uniforms.uDents.value, phases.dent, time);

            pulls.forEach((p, i) => {
                const target = uniforms.uPulls.value[i];
                target.x += flowStep * p.drift;
                target.y = THREE.MathUtils.clamp(
                    p.home + 0.07 * Math.sin(time * (0.45 + 0.21 * i) + i * 2.1), 0.08, 0.92);
            });

            composer.render();
            
        });

        addEventListener("resize", resize);

        /* --- DEV: boot replay button (delete this whole block later) --- */
        {
            const btn = document.createElement("button");
            btn.textContent = "Replay boot";
            Object.assign(btn.style, {
                position: "fixed", top: "16px", right: "16px", zIndex: "9999",
                padding: "8px 14px", cursor: "pointer", pointerEvents: "auto",
                font: "500 12px/1 system-ui, sans-serif", letterSpacing: "0.04em",
                color: "#cfe8ff", background: "rgba(20,28,40,0.75)",
                border: "1px solid rgba(140,170,210,0.45)", borderRadius: "6px",
            });
            btn.addEventListener("click", () => window.bootOrb());
            document.body.appendChild(btn);
        }

        {
            const micBtn = document.createElement("button")
            micBtn.textContent = "Request Mic";
            Object.assign(micBtn.style,{
                position: "fixed", top: "56px", right: "16px", zIndex: "9999",
                padding: "8px 14px", cursor: "pointer", pointerEvents: "auto",
                font: "500 12px/1 system-ui, sans-serif", letterSpacing: "0.04em",
                color: "#cfe8ff", background: "rgba(20,28,40,0.75)",
                border: "1px solid rgba(140,170,210,0.45)", borderRadius: "6px",
            })
            micBtn.addEventListener("click", () => getMicrophone());
            document.body.appendChild(micBtn);
        }

        {
            const hints = document.createElement("p")
            hints.textContent = "It reacts to mic too. Request Access above. Boot plays audio, use headset."

            Object.assign(hints.style, {
                position: "fixed",
                bottom: "40px",
                right: "40px",
                zIndex: "9999",
                color: "#b9d4eb",
                font: "500 12px/1 system-ui, sans-serif",
                fontFamily: "sans-serif",
                fontSize: "100%",
            })

            document.body.appendChild(hints);
        }
            
        /* --- /DEV --- */

    </script>
</body>

</html>
